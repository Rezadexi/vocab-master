<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d28d9">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="manifest" href="manifest.json?v=6">
<title>VocabMaster v6 | سریع و همیشه بروز</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header>
<h1>🧠 VocabMaster</h1>
<p>نسخه 6 - سریع، بدون کش، بدون فیلتر</p>
<nav>
<button onclick="showTab('learn')" id="btn-learn" class="active">📚 آموزش</button>
<button onclick="showTab('review')" id="btn-review">🔁 تمرین</button>
<button onclick="showTab('list')" id="btn-list">📖 لغات من</button>
</nav>
</header>
<main>
<section id="tab-learn" class="tab active">
<div class="card">
<h2>➕ لغت جدید</h2>
<div class="row">
<input id="inp-word" placeholder="word">
<input id="inp-meaning" placeholder="معنی فارسی">
<button onclick="addWord()">افزودن</button>
</div>
</div>
<div id="learn-result"></div>
</section>
<section id="tab-review" class="tab">
<div class="card">
<h2>🔁 تمرین هوشمند</h2>
<p id="review-stats"></p>
<div class="row">
<button onclick="startQuiz('mixed')">⭐ ترکیبی</button>
<button onclick="startQuiz('en-fa')">EN به FA</button>
<button onclick="startQuiz('fa-en')">FA به EN</button>
<button onclick="startQuiz('listening')">👂 شنیداری</button>
<button onclick="startQuiz('image')">🖼️ تصویری</button>
</div>
<div id="quiz-box"></div>
</div>
</section>
<section id="tab-list" class="tab">
<div class="card">
<h2>📖 لغات من</h2>
<div class="row">
<input id="search-inp" placeholder="جستجو... (مثلا book)" oninput="renderList(1)">
</div>
<div id="word-list"></div>
<div class="row" id="pages"></div>
</div>
</section>
</main>
<script src="script.js?v=6"></script>
<script>
// پاک کردن سرویس ورکر قدیمی که باعث بروز نشدن میشد
if('serviceWorker' in navigator){
navigator.serviceWorker.getRegistrations().then(rs=>{rs.forEach(r=>r.unregister());});
}
if('caches' in window){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
</script>
</body>
</html>
