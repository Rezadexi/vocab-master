<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VocabMaster V8</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#7c3aed,#06b6d4);padding:20px;text-align:center;border-radius:0 0 20px 20px}
header h1{margin:0}header p{margin:5px 0 0;font-size:12px}
nav{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
nav button{padding:9px 18px;border:none;border-radius:999px;background:rgba(255,255,255,.3);color:#fff;cursor:pointer}
nav button.active{background:#fff;color:#6d28d9;font-weight:bold}
main{max-width:900px;margin:14px auto;padding:0 12px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;min-width:120px}
button{padding:11px 16px;border-radius:10px;border:none;background:#8b5cf6;color:#fff;font-weight:bold;cursor:pointer}
.tab{display:none}.tab.active{display:block}
.def{background:#0f172a;padding:10px;border-radius:10px;margin:6px 0;border-right:4px solid #8b5cf6;line-height:1.9}
.ex{color:#94a3b8}
.badge{display:inline-block;background:#0ea5e9;padding:3px 10px;border-radius:999px;font-size:12px;margin:2px}
.badge.lvl{background:#f59e0b;color:#000}
.opt{display:block;width:100%;margin:6px 0;padding:12px;background:#0f172a;border:1px solid #475569;color:#fff;border-radius:10px;font-size:16px;cursor:pointer}
.opt.ok{background:#16a34a}.opt.no{background:#dc2626}
img.q{width:100%;max-height:240px;object-fit:cover;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>VocabMaster</h1>
<p>نسخه 8 - تک‌فایل - تست شده ✅</p>
<nav>
<button id="b-learn" class="active" onclick="tab('learn')">آموزش</button>
<button id="b-review" onclick="tab('review')">تمرین</button>
<button id="b-list" onclick="tab('list')">لغات من</button>
</nav>
</header>
<main>
<section id="t-learn" class="tab active">
<div class="card"><h3>➕ لغت جدید</h3>
<div class="row"><input id="w" placeholder="english word"><input id="m" placeholder="معنی فارسی"><button onclick="add()">افزودن</button></div>
<p id="msg" style="color:#4ade80"></p>
</div><div id="out"></div>
</section>
<section id="t-review" class="tab">
<div class="card"><h3>🔁 تمرین</h3><p id="st"></p>
<div class="row">
<button onclick="start('mixed')">⭐ ترکیبی</button>
<button onclick="start('en-fa')">EN→FA</button>
<button onclick="start('fa-en')">FA→EN</button>
<button onclick="start('listening')">👂 شنیداری</button>
<button onclick="start('image')">🖼️ تصویری</button>
</div><div id="qb"></div></div>
</section>
<section id="t-list" class="tab">
<div class="card"><h3>📖 لغات من</h3>
<div class="row"><input id="s" placeholder="جستجو..." oninput="list(1)"></div>
<div id="wl"></div><div class="row" id="pg"></div></div>
</section>
</main>
<script>
var DB=[];try{DB=JSON.parse(localStorage.getItem('vm8')||'[]')}catch(e){DB=[]}
function save(){localStorage.setItem('vm8',JSON.stringify(DB))}
function tab(t){var secs=document.querySelectorAll('.tab');for(var i=0;i<secs.length;i++)secs[i].classList.remove('active');var btns=document.querySelectorAll('nav button');for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');document.getElementById('t-'+t).classList.add('active');document.getElementById('b-'+t).classList.add('active');if(t=='list')list(1);if(t=='review')stats()}
function add(){
var w=document.getElementById('w').value.trim().toLowerCase();
var m=document.getElementById('m').value.trim();
if(!w||!m){alert('هر دو را بنویس');return}
var found=null;for(var i=0;i<DB.length;i++)if(DB[i].word==w)found=DB[i];
if(!found){DB.unshift({word:w,meaning:m,level:0,next:Date.now()});save()}
document.getElementById('msg').textContent='ذخیره شد: '+w+' = '+m;
document.getElementById('w').value='';document.getElementById('m').value='';
learn(w,m);list(1);stats();
}
function dict(w){
return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+w).then(function(r){if(!r.ok)return null;return r.json()}).catch(function(){return null});
}
function lvl(w){if(w.length<=4)return 'A1';if(w.length<=6)return 'A2';if(w.length<=8)return 'B1';if(w.length<=10)return 'B2';return 'C1'}
function learn(word,my){
var box=document.getElementById('out');
box.innerHTML='<div class="card">⏳ در حال دریافت معنی '+word+' ... (معنی تو ذخیره شد)</div>';
dict(word).then(function(d){
var phon='',aud='',defs='',ex='';
if(d&&d[0]){
phon=d[0].phonetic||'';
try{for(var k=0;k<d[0].phonetics.length;k++)if(d[0].phonetics[k].audio){aud=d[0].phonetics[k].audio;break}}catch(e){}
try{
for(var a=0;a<Math.min(2,d[0].meanings.length);a++){
var mn=d[0].meanings[a];
defs+='<div class="def"><span class="badge">'+mn.partOfSpeech+'</span>';
for(var b=0;b<Math.min(2,mn.definitions.length);b++){
var x=mn.definitions[b];
defs+='<p>'+(b+1)+'. '+x.definition+'</p>';
if(x.example){defs+='<p class="ex">Ex: '+x.example+'</p>';if(!ex)ex=x.example}
}
defs+='</div>'
}
}catch(e){}
}
if(!ex)ex='I learned '+word+' today.';
var L=lvl(word);
var warn=defs?'':'<p style="color:#fbbf24">⚠️ دیکشنری لود نشد (فیلتر است). با فیلترشکن دوباره امتحان کن. معنی خودت ذخیره است.</p>';
box.innerHTML='<div class="card"><h2>'+word+' <span style="color:#38bdf8;font-size:15px">'+phon+'</span></h2><p><span class="badge lvl">سطح '+L+'</span> <span class="badge">'+my+'</span></p><div class="row">'+(aud?'<button onclick="new Audio(\''+aud+'\').play()">🔊 تلفظ</button>':'')+'<button onclick="sp(\''+word+'\')">آفلاین</button></div>'+warn+'<h4>📖 دایره لغات</h4>'+defs+'<h4>🎬 فیلم V8</h4><div class="row"><a href="https://www.aparat.com/search/'+word+'" target="_blank"><button>▶️ آپارات</button></a><a href="https://playphrase.me/#/search?q='+word+'" target="_blank"><button>🎞️ تیکه سریال</button></a><a href="https://youglish.com/pronounce/'+word+'/english" target="_blank"><button>YouGlish</button></a></div><h4>💡 جمله</h4><p class="def">'+ex+'</p></div>';
});
}
function sp(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
function stats(){var c=0;for(var i=0;i<DB.length;i++)if(DB[i].next<=Date.now())c++;document.getElementById('st').innerHTML='کل: '+DB.length+' | امروز: '+c}
function list(p){p=p||1;var qv=document.getElementById('s').value.trim().toLowerCase();var f=[];for(var i=0;i<DB.length;i++)if(!qv||DB[i].word.indexOf(qv)>-1||DB[i].meaning.indexOf(qv)>-1)f.push(DB[i]);var per=50;var tot=Math.ceil(f.length/per)||1;var sl=f.slice((p-1)*per,p*per);var html='';for(var j=0;j<sl.length;j++)html+='<div class="def"><b>'+sl[j].word+'</b> = '+sl[j].meaning+' <button onclick="learn(\''+sl[j].word+'\',\''+sl[j].meaning+'\')">آموزش</button></div>';document.getElementById('wl').innerHTML=html||'خالیه';var h='';for(var k=1;k<=Math.min(tot,15);k++)h+='<button onclick="list('+k+')">'+k+'</button>';document.getElementById('pg').innerHTML=h;}
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var Q=[],QI=0,SC=0,QM='mixed';
function start(m){if(DB.length<2){alert('حداقل 2 لغت');return}QM=m;Q=sh(DB.slice()).slice(0,10);QI=0;SC=0;nq()}
function gd(c,f){var o=[];for(var i=0;i<DB.length;i++)if(DB[i].word!=c.word)o.push(DB[i][f]);return sh(o).slice(0,3)}
function nq(){stats();var b=document.getElementById('qb');if(QI>=Q.length){b.innerHTML='<h3>🎉 تمام! '+SC+' از '+Q.length+'</h3>';return}var w=Q[QI];var typs=['en-fa','fa-en','blank','image'];var t=QM=='mixed'?typs[Math.floor(Math.random()*typs.length)]:QM;
if(t=='listening'){b.innerHTML='<p>گوش بده و تایپ کن</p><div class="row"><button onclick="sp(\''+w.word+'\')">پخش</button></div><div class="row"><input id="li"><button onclick="cl(\''+w.word+'\')">ثبت</button></div>';sp(w.word);return}
if(t=='image'){var im='https://loremflickr.com/600/350/'+encodeURIComponent(w.word);var o=sh([w.word].concat(gd(w,'word')));var hh='<p>این عکس چیه؟</p><img class="q" loading="lazy" src="'+im+'" onerror="this.src=\'https://picsum.photos/seed/'+w.word+'/600/350\'">';for(var i=0;i<o.length;i++)hh+='<button class="opt" onclick="ans(this,\''+o[i]+'\',\''+w.word+'\',\''+w.word+'\')">'+o[i]+'</button>';b.innerHTML=hh;return}
if(t=='en-fa'){var o2=sh([w.meaning].concat(gd(w,'meaning')));var h2='<h3 style="text-align:center">'+w.word+' یعنی چی؟</h3>';for(var a=0;a<o2.length;a++)h2+='<button class="opt" onclick="ans(this,\''+o2[a]+'\',\''+w.meaning+'\',\''+w.word+'\')">'+o2[a]+'</button>';b.innerHTML=h2;return}
if(t=='fa-en'){var o3=sh([w.word].concat(gd(w,'word')));var h3='<h3 style="text-align:center">'+w.meaning+' به انگلیسی؟</h3>';for(var c=0;c<o3.length;c++)h3+='<button class="opt" onclick="ans(this,\''+o3[c]+'\',\''+w.word+'\',\''+w.word+'\')">'+o3[c]+'</button>';b.innerHTML=h3;return}
b.innerHTML='...';dict(w.word).then(function(d){var s='I learned '+w.word;try{var arr=d[0].meanings[0].definitions;for(var k=0;k<arr.length;k++)if(arr[k].example){s=arr[k].example;break}}catch(e){}var mk=s.replace(new RegExp(w.word,'ig'),'_____');var o4=sh([w.word].concat(gd(w,'word')));var h4='<p class="def">'+mk+'</p>';for(var q=0;q<o4.length;q++)h4+='<button class="opt" onclick="ans(this,\''+o4[q]+'\',\''+w.word+'\',\''+w.word+'\')">'+o4[q]+'</button>';document.getElementById('qb').innerHTML=h4;});}
function cl(c){var v=document.getElementById('li').value.trim().toLowerCase();upd(c,v==c);if(v!=c)alert('درست: '+c);else SC++;QI++;nq()}
function ans(b,v,cor,wd){var all=document.querySelectorAll('.opt');for(var i=0;i<all.length;i++)if(all[i].textContent==cor)all[i].classList.add('ok');if(v==cor){SC++;upd(wd,true)}else{b.classList.add('no');upd(wd,false)}setTimeout(function(){QI++;nq()},700)}
function upd(wd,ok){for(var i=0;i<DB.length;i++)if(DB[i].word==wd){if(ok)DB[i].level++;else DB[i].level=0;DB[i].next=Date.now()+86400000}save()}
list(1);stats();
</script>
</body>
</html>
