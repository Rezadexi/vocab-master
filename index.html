<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VocabMaster V21</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{margin:0;background:#0b1020;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#7c3aed,#06b6d4);padding:20px;text-align:center;border-radius:0 0 24px 24px}
header h1{margin:0}header p{font-size:12px;opacity:.9}
.dash{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:940px;margin:10px auto 0;padding:0 10px}
.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:8px;text-align:center}.stat b{display:block}.stat span{font-size:10px;color:#cbd5e1}
nav{max-width:940px;margin:10px auto;padding:0 10px;display:flex;gap:6px;flex-wrap:wrap}
nav button{flex:1;padding:11px;border:none;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-weight:bold;min-width:85px;cursor:pointer}
nav button.active{background:#fff;color:#7c3aed}
main{max-width:940px;margin:10px auto;padding:0 10px 30px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select{flex:1;padding:11px;border-radius:10px;border:1px solid #475569;background:#0b1020;color:#fff;min-width:110px}
button{padding:10px 14px;border-radius:10px;border:none;background:#8b5cf6;color:#fff;font-weight:bold;cursor:pointer}
button.ghost{background:#0b1020;border:1px solid #475569}
.tab{display:none}.tab.active{display:block}
.def{background:#0b1020;padding:10px;border-radius:10px;margin:6px 0;border-right:4px solid #8b5cf6}
.badge{background:#0ea5e9;padding:2px 10px;border-radius:99px;font-size:12px;margin:2px;display:inline-block}
.opt{display:block;width:100%;margin:6px 0;padding:12px;background:#0b1020;border:1px solid #475569;color:#fff;border-radius:10px}
.opt.ok{background:#16a34a}.opt.no{background:#dc2626}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
.lesson{background:#0b1020;border:1px solid #475569;border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.wordpick{display:flex;gap:10px;align-items:center;background:#0b1020;border:1px solid #334155;border-radius:12px;padding:10px;margin:8px 0}
.wordpick img{width:120px;height:90px;object-fit:cover;border-radius:10px;flex-shrink:0;background:#1e293b}
.wordpick input[type=checkbox]{width:22px;height:22px;flex-shrink:0;cursor:pointer}
.wordpick .info{flex:1}
.ex{color:#94a3b8;font-size:12px}
img.q{width:100%;max-height:240px;object-fit:cover;border-radius:10px;display:block}
canvas{width:100%;background:#0b1020;border-radius:12px}
</style>
</head>
<body>
<header><h1>🧠 VocabMaster V21</h1><p>عکس واقعی کتاب + ۱۲ درس OPD ✅</p></header>
<div class="dash"><div class="stat"><b id="d-t">0</b><span>لغت</span></div><div class="stat"><b id="d-d">0</b><span>سررسید</span></div><div class="stat"><b id="d-xp">0</b><span>XP</span></div><div class="stat"><b id="d-s">🔥0</b><span>استریک</span></div><div class="stat"><b id="d-g">0%</b><span>هدف</span></div></div>
<nav>
<button id="b-learn" class="active" onclick="tab('learn')">📚 آموزش</button>
<button id="b-book" onclick="tab('book')">📖 کتابی</button>
<button id="b-review" onclick="tab('review')">🔁 تمرین</button>
<button id="b-stats" onclick="tab('stats')">📊 کارنامه</button>
<button id="b-list" onclick="tab('list')">📂 بانک</button>
</nav>
<main>
<section id="t-learn" class="tab active">
<div class="card"><h3>➕ لغت آزاد</h3><div class="row"><input id="w" placeholder="english"><input id="m" placeholder="معنی"><button onclick="add()">افزودن</button></div><p id="msg" style="color:#4ade80"></p></div><div id="out"></div>
</section>
<section id="t-book" class="tab">
<div class="card"><h3>📖 OPD (۱۲ درس) + Word Skills (۶ یونیت)</h3>
<p class="ex">عکس‌ها واقعی از ویکی‌پدیا لود می‌شن. اگه خواستی کل کتاب رو بریزی، فایل JSON بده با دکمه ایمپورت.</p>
<div class="row"><select id="bookSel" onchange="renderLessons()"><option value="OPD">OPD</option><option value="WS">Word Skills</option></select><button class="ghost" onclick="document.getElementById('bj').click()">⬆️ ایمپورت JSON کتاب</button><input type="file" id="bj" accept=".json" style="display:none" onchange="importBook(this)"></div>
<div class="lesson-grid" id="lessons"></div><div id="lessonView"></div></div>
</section>
<section id="t-review" class="tab">
<div class="card"><h3>🔁 تمرین</h3><p id="st" class="ex"></p>
<div class="row"><select id="filterCat"><option value="">همه</option></select><button onclick="start('mixed')">⭐ هوشمند</button><button class="ghost" onclick="start('en-fa')">EN→FA</button><button class="ghost" onclick="start('fa-en')">FA→EN</button><button class="ghost" onclick="start('image')">🖼️ تصویری</button><button class="ghost" onclick="start('listening')">👂 شنیداری</button></div>
<div id="qb"></div></div>
</section>
<section id="t-stats" class="tab"><div class="card"><h3>📊 کارنامه ۷ روز</h3><canvas id="ch" height="150"></canvas><p id="sum" class="ex"></p></div><div class="card"><h3>🚨 ضعیف‌ها</h3><div id="weak"></div></div></section>
<section id="t-list" class="tab"><div class="card"><h3>📂 بانک</h3><div class="row"><button onclick="exportBK()">⬇️ بکاپ</button><button class="ghost" onclick="document.getElementById('imp').click()">⬆️ برگردوندن</button><input type="file" id="imp" accept=".json" style="display:none" onchange="importBK(this)"></div><div class="row"><input id="s" placeholder="جستجو..." oninput="list(1)"></div><div id="wl"></div></div></section>
</main>
<script>
function autoCat(w,m){w=(w||'').toLowerCase();var M={fork:'آشپزخانه',spoon:'آشپزخانه',knife:'آشپزخانه',plate:'آشپزخانه',cup:'آشپزخانه',pan:'آشپزخانه',pot:'آشپزخانه',oven:'آشپزخانه',fridge:'آشپزخانه',eye:'بدن',nose:'بدن',mouth:'بدن',hand:'بدن',foot:'بدن',head:'بدن',heart:'بدن',dog:'حیوانات',cat:'حیوانات',bird:'حیوانات',apple:'غذا',bread:'غذا',rice:'غذا',shirt:'لباس',shoes:'لباس',car:'سفر',hotel:'سفر',book:'مدرسه',school:'مدرسه',computer:'تکنولوژی',mother:'خانواده',father:'خانواده',doctor:'شغل',football:'ورزش',tree:'طبیعت'};if(M[w])return M[w];return 'عمومی';}
function loadAll(){var a=[],s={};['vm21','vm20','vm19'].forEach(function(k){try{var d=JSON.parse(localStorage.getItem(k)||'[]');d.forEach(function(x){if(x.word&&!s[x.word]){s[x.word]=1;if(!x.cat)x.cat=autoCat(x.word,x.meaning);if(x.wrong==null)x.wrong=0;if(x.streak==null)x.streak=0;if(x.next==null)x.next=Date.now();a.push(x);}})}catch(e){}});return a;}
var DB=loadAll();var META={};try{META=JSON.parse(localStorage.getItem('vm21meta')||localStorage.getItem('vm20meta')||'{}')}catch(e){}if(!META.xp)META.xp=0;if(!META.hist)META.hist={};if(!META.goal)META.goal=20;if(!META.streak)META.streak=0;
function save(){localStorage.setItem('vm21',JSON.stringify(DB));localStorage.setItem('vm21meta',JSON.stringify(META));}save();
function tab(t){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('active')});document.getElementById('t-'+t).classList.add('active');document.getElementById('b-'+t).classList.add('active');if(t=='list')list(1);if(t=='review')stats();if(t=='book')renderLessons();if(t=='stats')renderStats();}
function sp(t){if(!t)return;try{new Audio('https://api.streamelements.com/kappa/v2/speech?voice=Brian&text='+encodeURIComponent(t)).play().catch(function(){var u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u);});}catch(e){}}
function add(){var w=document.getElementById('w').value.trim().toLowerCase(),m=document.getElementById('m').value.trim();if(!w||!m){alert('هر دو');return;}var e=false;DB.forEach(function(x){if(x.word==w)e=true});if(!e){DB.unshift({word:w,meaning:m,cat:autoCat(w,m),wrong:0,streak:0,next:Date.now()});save();}document.getElementById('w').value='';document.getElementById('m').value='';dash();}
function learnFast(w,m){document.getElementById('out').innerHTML='<div class="card"><h2>'+w+'</h2></div>';}
// ===== BOOKS FULLER =====
var OPD=[
{lesson:1,title:'درس ۱ - آشپزخانه',words:[['fork','چنگال'],['spoon','قاشق'],['knife','چاقو'],['plate','بشقاب'],['cup','فنجان'],['pan','ماهیتابه'],['pot','قابلمه'],['oven','فر'],['fridge','یخچال'],['sink','سینک']]},
{lesson:2,title:'درس ۲ - بدن',words:[['eye','چشم'],['nose','بینی'],['mouth','دهان'],['hand','دست'],['foot','پا'],['head','سر'],['heart','قلب'],['ear','گوش'],['hair','مو'],['tooth','دندان']]},
{lesson:3,title:'درس ۳ - خانه',words:[['mother','مادر'],['father','پدر'],['bed','تخت'],['chair','صندلی'],['table','میز'],['door','در'],['window','پنجره'],['lamp','چراغ'],['sofa','مبل'],['carpet','فرش']]},
{lesson:4,title:'درس ۴ - مدرسه',words:[['book','کتاب'],['pen','خودکار'],['pencil','مداد'],['school','مدرسه'],['teacher','معلم'],['student','دانش‌آموز'],['classroom','کلاس'],['bag','کیف']]},
{lesson:5,title:'درس ۵ - شغل‌ها',words:[['doctor','پزشک'],['engineer','مهندس'],['driver','راننده'],['cook','آشپز'],['farmer','کشاورز'],['nurse','پرستار']]},
{lesson:6,title:'درس ۶ - سفر',words:[['car','ماشین'],['bus','اتوبوس'],['train','قطار'],['airplane','هواپیما'],['ticket','بلیط'],['hotel','هتل'],['passport','پاسپورت'],['map','نقشه']]},
{lesson:7,title:'درس ۷ - غذا',words:[['apple','سیب'],['bread','نان'],['rice','برنج'],['meat','گوشت'],['milk','شیر'],['egg','تخم‌مرغ'],['cheese','پنیر'],['water','آب']]},
{lesson:8,title:'درس ۸ - لباس',words:[['shirt','پیراهن'],['pants','شلوار'],['shoes','کفش'],['jacket','کاپشن'],['hat','کلاه'],['dress','پیراهن زنانه']]},
{lesson:9,title:'درس ۹ - حیوانات',words:[['dog','سگ'],['cat','گربه'],['bird','پرنده'],['fish','ماهی'],['horse','اسب'],['cow','گاو']]},
{lesson:10,title:'درس ۱۰ - شهر',words:[['street','خیابان'],['bank','بانک'],['hospital','بیمارستان'],['shop','مغازه'],['park','پارک'],['bridge','پل']]},
{lesson:11,title:'درس ۱۱ - ورزش',words:[['football','فوتبال'],['tennis','تنیس'],['swim','شنا'],['run','دویدن'],['ball','توپ'],['gym','باشگاه']]},
{lesson:12,title:'درس ۱۲ - تکنولوژی',words:[['computer','کامپیوتر'],['phone','تلفن'],['internet','اینترنت'],['camera','دوربین'],['screen','صفحه‌نمایش'],['keyboard','کیبورد']]}
];
var WS=[
{lesson:1,title:'یونیت ۱ - احساسات',words:[['happy','خوشحال'],['sad','ناراحت'],['angry','عصبانی'],['excited','هیجان‌زده'],['tired','خسته'],['worried','نگران']]},
{lesson:2,title:'یونیت ۲ - شخصیت',words:[['kind','مهربان'],['brave','شجاع'],['lazy','تنبل'],['smart','باهوش'],['funny','بامزه']]},
{lesson:3,title:'یونیت ۳ - آب‌وهوا',words:[['sunny','آفتابی'],['rainy','بارانی'],['cloudy','ابری'],['windy','بادی'],['snowy','برفی']]},
{lesson:4,title:'یونیت ۴ - خرید',words:[['price','قیمت'],['cheap','ارزان'],['expensive','گران'],['shop','خرید کردن'],['money','پول']]},
{lesson:5,title:'یونیت ۵ - سلامت',words:[['healthy','سالم'],['sick','مریض'],['pain','درد'],['medicine','دارو'],['sleep','خواب']]},
{lesson:6,title:'یونیت ۶ - کار',words:[['office','اداره'],['meeting','جلسه'],['boss','رئیس'],['salary','حقوق'],['job','شغل']]}
];
function renderLessons(){var b=document.getElementById('bookSel').value,data=b=='OPD'?OPD:WS,h='';data.forEach(function(L,i){h+='<div class="lesson" onclick="openLesson('+i+')"><b>'+L.title+'</b><br><span class="ex">'+L.words.length+' کلمه</span></div>'});document.getElementById('lessons').innerHTML=h;document.getElementById('lessonView').innerHTML='';}
var CUR=null;
function wikiThumb(w,cb){fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(w)).then(function(r){return r.json()}).then(function(j){if(j&&j.thumbnail)cb(j.thumbnail.source);else cb('https://picsum.photos/seed/'+w+'/240/180')}).catch(function(){cb('https://picsum.photos/seed/'+w+'/240/180')});}
function openLesson(i){var b=document.getElementById('bookSel').value,data=b=='OPD'?OPD:WS;CUR=data[i];var h='<div class="card"><h3>'+CUR.title+' ('+CUR.words.length+' کلمه - عکس واقعی)</h3>';CUR.words.forEach(function(pair){var w=pair[0],m=pair[1],has=false;DB.forEach(function(x){if(x.word==w)has=true});h+='<div class="wordpick"><input type="checkbox" data-w="'+w+'" data-m="'+m+'" '+(has?'checked disabled':'')+'><img data-wiki="'+w+'" src="https://picsum.photos/seed/'+w+'/240/180" loading="lazy"><div class="info"><b style="direction:ltr;display:block">'+w+'</b><span class="ex">'+m+' | '+autoCat(w,m)+'</span><br><button class="ghost" onclick="sp(\''+w+'\')">🔊 تلفظ</button></div></div>'});h+='<div class="row"><button onclick="addLesson()">➕ اضافه تیک‌خورده‌ها به بانک</button><button class="ghost" onclick="quizLesson()">تست از همین درس</button></div></div>';document.getElementById('lessonView').innerHTML=h;
document.querySelectorAll('img[data-wiki]').forEach(function(im){var w=im.getAttribute('data-wiki');wikiThumb(w,function(src){im.src=src;});});
}
function addLesson(){var c=document.querySelectorAll('#lessonView input:not(:disabled)'),n=0;for(var i=0;i<c.length;i++)if(c[i].checked){var w=c[i].getAttribute('data-w'),m=c[i].getAttribute('data-m'),e=false;DB.forEach(function(x){if(x.word==w)e=true});if(!e){DB.unshift({word:w,meaning:m,cat:autoCat(w,m),wrong:0,streak:0,next:Date.now()});n++;}}save();dash();alert(n+' اضافه شد (تکراری حذف شد)');}
function quizLesson(){if(!CUR)return;Q=CUR.words.map(function(x){return {word:x[0],meaning:x[1],cat:autoCat(x[0],x[1])}});QI=0;SC=0;QM='mixed';tab('review');nq();}
function importBook(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(j.OPD)OPD=j.OPD;if(j.WS)WS=j.WS;renderLessons();alert('کتاب ایمپورت شد');}catch(e){alert('فایل خراب است - باید {OPD:[...],WS:[...]} باشد')}};r.readAsText(f);}
// rest
function dash(){document.getElementById('d-t').textContent=DB.length;var d=0;DB.forEach(function(x){if(x.next<=Date.now())d++});document.getElementById('d-d').textContent=d;document.getElementById('d-xp').textContent=META.xp;document.getElementById('d-s').textContent='🔥'+META.streak;}
function stats(){dash();var sel=document.getElementById('filterCat'),cats={};DB.forEach(function(x){cats[x.cat]=1});sel.innerHTML='<option value="">همه</option>';for(var k in cats)sel.innerHTML+='<option>'+k+'</option>';}
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var Q=[],QI=0,SC=0,QM='mixed';
function pool(){var f=document.getElementById('filterCat').value;return f?DB.filter(function(x){return x.cat==f}):DB;}
function start(m){var p=pool();if(p.length<2){alert('کمه');return;}QM=m;Q=sh(p.slice()).slice(0,10);QI=0;SC=0;nq();}
function gd(c,f){var p=pool(),o=[];p.forEach(function(x){if(x.word!=c.word)o.push(x[f])});return sh(o).slice(0,3);}
function nq(){var b=document.getElementById('qb');if(QI>=Q.length){b.innerHTML='<h3>تمام '+SC+' از '+Q.length+'</h3>';META.xp+=SC*10;save();dash();return;}var w=Q[QI],o=sh([w.word].concat(gd(w,'word')));var o2=sh([w.meaning].concat(gd(w,'meaning')));var t=QM=='mixed'?['en-fa','fa-en','image'][Math.floor(Math.random()*3)]:QM;
if(t=='image'){b.innerHTML='<p>🖼️ این عکس چیه؟</p><img class="q" src="https://picsum.photos/seed/'+w.word+'/600/350">'+o.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.word+'\')">'+x+'</button>'}).join('');wikiThumb(w.word,function(s){var im=document.querySelector('#qb img.q');if(im)im.src=s;});return;}
if(t=='en-fa'){b.innerHTML='<h3 style="text-align:center">'+w.word+' یعنی چی؟</h3>'+o2.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.meaning+'\')">'+x+'</button>'}).join('');return;}
b.innerHTML='<h3 style="text-align:center">'+w.meaning+' به انگلیسی؟</h3>'+o.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.word+'\')">'+x+'</button>'}).join('');}
function ans(b,v,cor){var ok=v==cor;document.querySelectorAll('.opt').forEach(function(x){if(x.textContent==cor)x.classList.add('ok')});if(!ok)b.classList.add('no');else SC++;var t=new Date().toDateString();if(!META.hist[t])META.hist[t]={ok:0,no:0};if(ok)META.hist[t].ok++;else META.hist[t].no++;for(var i=0;i<DB.length;i++)if(DB[i].word==Q[QI].word){if(ok){DB[i].streak++;if(DB[i].wrong>0)DB[i].wrong--}else{DB[i].streak=0;DB[i].wrong++}DB[i].next=Date.now()+86400000}save();setTimeout(function(){QI++;nq()},500);}
function renderStats(){var c=document.getElementById('ch'),ctx=c.getContext('2d');c.width=c.offsetWidth*2;c.height=300;ctx.scale(2,2);var W=c.offsetWidth,H=150,days=[];for(var d=6;d>=0;d--){var dt=new Date();dt.setDate(dt.getDate()-d);days.push(dt.toDateString())}var mx=5;days.forEach(function(k){var h=META.hist[k];if(h&&h.ok+h.no>mx)mx=h.ok+h.no});var bw=W/7;days.forEach(function(k,i){var h=META.hist[k]||{ok:0,no:0},bh=(h.ok+h.no)/mx*110||4;ctx.fillStyle='#334155';ctx.fillRect(i*bw+8,H-bh,bw-16,bh);ctx.fillStyle='#22c55e';ctx.fillRect(i*bw+8,H-(h.ok/mx*110||0),bw-16,h.ok/mx*110||0)});var wk=DB.filter(function(w){return w.wrong>=2}).slice(0,8);document.getElementById('weak').innerHTML=wk.map(function(w){return '<div class="def"><b>'+w.word+'</b>='+w.meaning+'</div>'}).join('')||'نداری';document.getElementById('sum').textContent='XP:'+META.xp;}
function exportBK(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)]));a.download='vocab-backup.json';a.click();}
function importBK(i){var f=i.files[0],r=new FileReader();r.onload=function(){var a=JSON.parse(r.result),s={};DB.forEach(function(x){s[x.word]=1});a.forEach(function(x){if(!s[x.word])DB.push(x)});save()};r.readAsText(f);}
function list(p){var q=document.getElementById('s').value.trim().toLowerCase(),f=DB.filter(function(x){return !q||x.word.includes(q)||x.meaning.includes(q)});document.getElementById('wl').innerHTML=f.slice(0,40).map(function(x){return '<div class="def">📁 '+x.cat+' <b>'+x.word+'</b>='+x.meaning+'</div>'}).join('');}
renderLessons();dash();
</script>
</body>
</html>
