<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocabMaster Vx FINAL - ووکب</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:#f2f4f8;color:#222}
header{background:#1a73e8;color:#fff;padding:16px;text-align:center}
.tabs{display:flex;gap:6px;justify-content:center;padding:10px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.tabs button{border:1px solid #ddd;background:#f8f9fa;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
.tabs button.active{background:#1a73e8;color:#fff}
.container{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:12px;margin:10px 0}
.en{font-weight:bold;direction:ltr;text-align:left;color:#1a73e8;font-size:18px}
.fa{color:#333}
.btn{border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:inherit;margin:2px}
.b-green{background:#34a853;color:#fff}.b-red{background:#ea4335;color:#fff}.b-blue{background:#1a73e8;color:#fff}.b-ghost{background:#eee}
input,select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;margin:4px 0}
img.wimg{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:6px}
.tickrow{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.tick{background:#fff;border:2px solid #ccc;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:18px}
</style>
</head>
<body>
<header><h1 style="margin:0">ووکب VocabMaster Vx FINAL</h1><div style="font-size:12px">نسخه پایدار قبلی - بدون تغییر رنگ و فونت</div></header>
<div class="tabs">
<button class="active" onclick="showTab('opd',this)">OPD 12 + WS 12</button>
<button onclick="showTab('need',this)">نیاز به آموزش (<span id="needCount">0</span>)</button>
<button onclick="showTab('train',this)">تمرین 5 حالته + SmartMix</button>
<button onclick="showTab('report',this)">کارنامه</button>
<button onclick="showTab('add',this)">افزودن کلمه</button>
</div>
<div class="container">
<div id="tab-opd"></div>
<div id="tab-need" style="display:none"></div>
<div id="tab-train" style="display:none"><div class="card">
<select id="mode"><option value="enfa">انگلیسی به فارسی</option><option value="faen">فارسی به انگلیسی</option><option value="spell">املا</option><option value="listen">شنیداری</option><option value="smart">SmartMix هوشمند</option></select>
<button class="btn b-blue" onclick="nextQuiz()">شروع / بعدی</button>
<div id="quizBox" style="margin-top:10px"></div></div></div>
<div id="tab-report" style="display:none"><div class="card"><h3>اشتباهات امروز</h3><div id="todayMist"></div><h3>کلمات ضعیف</h3><div id="weakBox"></div><button class="btn b-green" onclick="downloadBackup()">بکاپ JSON</button><input type="file" id="restoreFile" accept=".json" onchange="restoreBackup(event)"></div></div>
<div id="tab-add" style="display:none"><div class="card"><h3>افزودن کلمه</h3><input id="n_en" placeholder="English" style="direction:ltr"><input id="n_fa" placeholder="معنی فارسی"><input id="n_phon" placeholder="فونتیک"><select id="n_level"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select><input id="n_pos" placeholder="نوع کلمه"><button class="btn b-green" onclick="saveNewWord()">ذخیره</button></div></div>
</div>
<script>
let vm_db=JSON.parse(localStorage.getItem('vm_db')||'{}');
let vm_need=JSON.parse(localStorage.getItem('vm_need')||'[]');
let vm_meta=JSON.parse(localStorage.getItem('vm_meta')||'{"mistakes":{},"weak":{}}');
function persist(){localStorage.setItem('vm_db',JSON.stringify(vm_db));localStorage.setItem('vm_need',JSON.stringify(vm_need));localStorage.setItem('vm_meta',JSON.stringify(vm_meta));}
const OPD=[
{u:"Unit 1 - Classroom",cat:"Learning",w:[["board","تخته","/bɔːrd/","noun","A1"],["desk","میز تحریر","/desk/","noun","A1"],["chair","صندلی","/tʃer/","noun","A1"],["book","کتاب","/bʊk/","noun","A1"],["pen","خودکار","/pen/","noun","A1"],["pencil","مداد","/ˈpensl/","noun","A1"],["teacher","معلم","/ˈtiːtʃər/","noun","A1"],["student","دانش‌آموز","/ˈstuːdənt/","noun","A1"],["map","نقشه","/mæp/","noun","A1"],["door","در","/dɔːr/","noun","A1"],["window","پنجره","/ˈwɪndoʊ/","noun","A1"],["eraser","پاک‌کن","/ɪˈreɪsər/","noun","A2"]]},
{u:"Unit 2 - Words",cat:"Learning",w:[["letter","حرف","/ˈletər/","noun","A1"],["word","کلمه","/wɜːrd/","noun","A1"],["sentence","جمله","/ˈsentəns/","noun","A1"],["question","سوال","/ˈkwestʃən/","noun","A1"],["answer","جواب","/ˈænsər/","noun","A1"],["meaning","معنی","/ˈmiːnɪŋ/","noun","A2"]]},
{u:"Unit 3 - Days",cat:"Time",w:[["Monday","دوشنبه","/ˈmʌndeɪ/","noun","A1"],["weekend","آخر هفته","/ˌwiːkˈend/","noun","A1"],["today","امروز","/təˈdeɪ/","adv","A1"],["tomorrow","فردا","/təˈmɑːroʊ/","adv","A1"]]},
{u:"Unit 4 - Time",cat:"Time",w:[["morning","صبح","/ˈmɔːrnɪŋ/","noun","A1"],["evening","عصر","/ˈiːvnɪŋ/","noun","A1"],["night","شب","/naɪt/","noun","A1"],["hour","ساعت","/ˈaʊər/","noun","A1"]]},
{u:"Unit 5 - Family",cat:"People",w:[["mother","مادر","/ˈmʌðər/","noun","A1"],["father","پدر","/ˈfɑːðər/","noun","A1"],["sister","خواهر","/ˈsɪstər/","noun","A1"],["brother","برادر","/ˈbrʌðər/","noun","A1"],["family","خانواده","/ˈfæməli/","noun","A1"]]},
{u:"Unit 6 - Describing",cat:"People",w:[["tall","بلندقد","/tɔːl/","adj","A1"],["short","کوتاه","/ʃɔːrt/","adj","A1"],["happy","خوشحال","/ˈhæpi/","adj","A1"],["sad","ناراحت","/sæd/","adj","A1"]]},
{u:"Unit 7 - Routines",cat:"Life",w:[["wake up","بیدار شدن","/weɪk ʌp/","verb","A1"],["eat","خوردن","/iːt/","verb","A1"],["work","کار کردن","/wɜːrk/","verb","A1"],["sleep","خوابیدن","/sliːp/","verb","A1"]]},
{u:"Unit 8 - Clothes",cat:"Life",w:[["shirt","پیراهن","/ʃɜːrt/","noun","A1"],["shoes","کفش","/ʃuːz/","noun","A1"],["hat","کلاه","/hæt/","noun","A1"],["jacket","کاپشن","/ˈdʒækɪt/","noun","A1"]]},
{u:"Unit 9 - Food",cat:"Food",w:[["apple","سیب","/ˈæpl/","noun","A1"],["bread","نان","/bred/","noun","A1"],["cheese","پنیر","/tʃiːz/","noun","A1"],["milk","شیر","/mɪlk/","noun","A1"],["rice","برنج","/raɪs/","noun","A1"]]},
{u:"Unit 10 - Cafe",cat:"Food",w:[["coffee","قهوه","/ˈkɔːfi/","noun","A1"],["tea","چای","/tiː/","noun","A1"],["menu","منو","/ˈmenjuː/","noun","A2"],["bill","صورت‌حساب","/bɪl/","noun","A2"]]},
{u:"Unit 11 - Transport",cat:"Getting around",w:[["bus","اتوبوس","/bʌs/","noun","A1"],["train","قطار","/treɪn/","noun","A1"],["car","ماشین","/kɑːr/","noun","A1"],["taxi","تاکسی","/ˈtæksi/","noun","A1"]]},
{u:"Unit 12 - In town",cat:"Places",w:[["bank","بانک","/bæŋk/","noun","A1"],["park","پارک","/pɑːrk/","noun","A1"],["hospital","بیمارستان","/ˈhɑːspɪtl/","noun","A2"]]}
];
const WS=[
{u:"WS 1",w:[["what","چه","/wʌt/","pron","A1"],["where","کجا","/wer/","adv","A1"]]},
{u:"WS 2",w:[["children","بچه‌ها","/ˈtʃɪldrən/","noun","A1"]]},
{u:"WS 3",w:[["in","در","/ɪn/","prep","A1"],["on","روی","/ɒn/","prep","A1"]]},
{u:"WS 4",w:[["big","بزرگ","/bɪɡ/","adj","A1"],["small","کوچک","/smɔːl/","adj","A1"]]},
{u:"WS 5",w:[["like","دوست داشتن","/laɪk/","verb","A1"]]},
{u:"WS 6",w:[["uncle","عمو","/ˈʌŋkl/","noun","A1"]]},
{u:"WS 7",w:[["always","همیشه","/ˈɔːlweɪz/","adv","A1"]]},
{u:"WS 8",w:[["wear","پوشیدن","/wer/","verb","A1"]]},
{u:"WS 9",w:[["delicious","خوشمزه","/dɪˈlɪʃəs/","adj","A2"]]},
{u:"WS 10",w:[["please","لطفا","/pliːz/","adv","A1"]]},
{u:"WS 11",w:[["ticket","بلیت","/ˈtɪkɪt/","noun","A1"]]},
{u:"WS 12",w:[["city","شهر","/ˈsɪti/","noun","A1"]]}
];
function showTab(id,btn){['opd','need','train','report','add'].forEach(t=>document.getElementById('tab-'+t).style.display=t===id?'block':'none');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='need')renderNeed();if(id==='report')renderReport();}
function autoCat(en){en=en.toLowerCase();if(/apple|bread|cheese|rice|coffee|tea|menu|eat/.test(en))return 'آشپزخانه';if(/hand|eye|foot|head/.test(en))return 'بدن';return 'عمومی';}
function renderOPD(){let h='';OPD.forEach(U=>{h+=`<div class="card"><b>${U.cat} | ${U.u}</b>`;U.w.forEach(w=>{let key=U.u+w[0];h+=`<div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding:6px 0"><div><div class="en">${w[0]}</div><div>${w[1]} ${w[2]} ${w[3]} ${w[4]} ${autoCat(w[0])}</div></div><div class="tickrow"><span class="tick" onclick="mark('${key}','know')">✅</span><span class="tick" onclick="mark('${key}','need','${w[0]}','${w[1]}','${w[2]}','${w[3]}','${w[4]}')">❌</span></div></div>`});h+=`</div>`});WS.forEach(U=>{h+=`<div class="card"><b>${U.u}</b>`;U.w.forEach(w=>{let key=U.u+w[0];h+=`<div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding:6px 0"><div><div class="en">${w[0]}</div><div>${w[1]} ${w[2]}</div></div><div class="tickrow"><span class="tick" onclick="mark('${key}','know')">✅</span><span class="tick" onclick="mark('${key}','need','${w[0]}','${w[1]}','${w[2]}','${w[3]}','${w[4]}')">❌</span></div></div>`});h+=`</div>`});document.getElementById('tab-opd').innerHTML=h;}
function mark(key,type,en,fa,phon,pos,level){if(type==='know'){vm_db[key]='know';}else{vm_db[key]='need';if(en&&!vm_need.find(x=>x.en===en))vm_need.push({en,fa,phon,pos,level,ex:[`I like ${en}.`,`I don't like ${en}.`,`Do you like ${en}?`],date:Date.now()});}persist();updateCount();renderOPD();}
function updateCount(){document.getElementById('needCount').innerText=vm_need.length;}
function renderNeed(){let h=vm_need.length?'':'<div class="card">خالیه</div>';vm_need.forEach(w=>{h+=`<div class="card"><div class="en">${w.en}</div><div>${w.fa} ${w.phon||''} ${w.pos||''} ${w.level||''}</div><div style="font-size:13px">✅ ${w.ex?.[0]||''}<br>❌ ${w.ex?.[1]||''}<br>❓ ${w.ex?.[2]||''}</div><img class="wimg" loading="lazy" src="https://picsum.photos/seed/${encodeURIComponent(w.en)}/600/300"><div><button class="btn b-blue" onclick="speak('${w.en}')">تلفظ</button><a class="btn b-ghost" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(w.en)}">یوتیوب</a><a class="btn b-ghost" target="_blank" href="https://youglish.com/pronounce/${encodeURIComponent(w.en)}/english">YouGlish</a></div></div>`});document.getElementById('tab-need').innerHTML=h;}
function speak(t){new Audio('https://api.streamelements.com/kappa/v2/speech?voice=Brian&text='+encodeURIComponent(t)).play();}
function saveNewWord(){let en=n_en.value.trim(),fa=n_fa.value.trim();if(!en||!fa)return alert('کلمه و معنی');vm_need.push({en,fa,phon:n_phon.value,pos:n_pos.value,level:n_level.value,ex:[`I like ${en}.`,`I don't like ${en}.`,`Do you like ${en}?`],date:Date.now()});persist();updateCount();alert('ذخیره شد');}
let cur=null;
function allWords(){let a=[];OPD.forEach(U=>U.w.forEach(w=>a.push({en:w[0],fa:w[1]})));vm_need.forEach(w=>a.push({en:w.en,fa:w.fa}));return a;}
function nextQuiz(){let pool=allWords();cur=pool[Math.floor(Math.random()*pool.length)];let mode=document.getElementById('mode').value;if(mode==='smart')mode=['enfa','faen','spell','listen'][Math.floor(Math.random()*4)];let box=document.getElementById('quizBox');box.dataset.mode=mode;if(mode==='enfa')box.innerHTML=`<div class="en">${cur.en}</div><input id="q_ans"><button class="btn b-green" onclick="checkAns()">چک</button>`;else if(mode==='faen')box.innerHTML=`<div>${cur.fa}</div><input id="q_ans" style="direction:ltr"><button class="btn b-green" onclick="checkAns()">چک</button>`;else if(mode==='spell')box.innerHTML=`<div>${cur.fa}</div><input id="q_ans" style="direction:ltr"><button class="btn b-green" onclick="checkAns()">چک</button>`;else box.innerHTML=`<button class="btn b-blue" onclick="speak('${cur.en}')">پخش</button><input id="q_ans" style="direction:ltr"><button class="btn b-green" onclick="checkAns()">چک</button>`;}
function checkAns(){let mode=document.getElementById('quizBox').dataset.mode;let v=document.getElementById('q_ans').value.trim();let ok=mode==='enfa'?(v===cur.fa):(v.toLowerCase()===cur.en.toLowerCase());let today=new Date().toISOString().slice(0,10);if(!ok){vm_meta.mistakes[today]=vm_meta.mistakes[today]||[];vm_meta.mistakes[today].push(cur.en);vm_meta.weak=vm_meta.weak||{};vm_meta.weak[cur.en]=(vm_meta.weak[cur.en]||0)+1;alert('غلط! '+cur.en+' / '+cur.fa);}else alert('آفرین!');persist();}
function renderReport(){let today=new Date().toISOString().slice(0,10);document.getElementById('todayMist').innerHTML=(vm_meta.mistakes[today]||[]).join(', ')||'بدون اشتباه';let weak=Object.entries(vm_meta.weak||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);document.getElementById('weakBox').innerHTML=weak.map(([k,v])=>k+' - '+v).join('<br>')||'-';}
function downloadBackup(){let b=new Blob([JSON.stringify({vm_db,vm_need,vm_meta})],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vocab-backup.json';a.click();}
function restoreBackup(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{let j=JSON.parse(r.result);vm_db=j.vm_db||{};vm_need=j.vm_need||[];vm_meta=j.vm_meta||{};persist();updateCount();renderOPD();};r.readAsText(f);}
renderOPD();updateCount();
</script>
</body>
</html>
