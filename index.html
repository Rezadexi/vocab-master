<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{margin:0;min-height:100vh;color:#fff;background:#070b16}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#b45309,#0d9488);border-radius:0 0 28px 28px}
header h1{margin:0}header p{font-size:12px;opacity:.95}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:960px;margin:12px auto 0;padding:0 12px}
.stat{background:#1e293b;border:1px solid #f59e0b55;border-radius:14px;padding:10px;text-align:center}.stat b{display:block;color:#fde68a}.stat span{font-size:11px;color:#cbd5e1}
nav{max-width:960px;margin:12px auto;padding:0 12px;display:flex;gap:8px;flex-wrap:wrap}
nav button{flex:1;padding:12px;border:none;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:bold;min-width:90px;cursor:pointer}
nav button.active{background:linear-gradient(135deg,#f59e0b,#0d9488);color:#000}
main{max-width:960px;margin:12px auto;padding:0 12px 40px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;margin-bottom:12px}
.card.need{border-color:#f59e0b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{flex:1;padding:12px;border-radius:12px;border:1px solid #475569;background:#070b16;color:#fff;min-width:110px}
button{padding:11px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,#f59e0b,#0d9488);color:#000;font-weight:bold;cursor:pointer}
button.ghost{background:#070b16;border:1px solid #475569;color:#fff}
button.danger{background:#dc2626;color:#fff}
.tab{display:none}.tab.active{display:block}
.def{background:#070b16;padding:12px;border-radius:12px;margin:8px 0;border-right:4px solid #f59e0b;line-height:2}
.en-line{direction:ltr;text-align:left}.fa-line{color:#94a3b8;border-top:1px dashed #334155;margin-top:8px;padding-top:8px;font-size:13px}
.opt{display:block;width:100%;margin:7px 0;padding:13px;background:#070b16;border:1px solid #475569;color:#fff;border-radius:12px;cursor:pointer}
.opt.ok{background:#16a34a}.opt.no{background:#dc2626}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.lesson{background:#070b16;border:1px solid #475569;border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.mod{margin-top:12px;padding:10px;background:linear-gradient(90deg,#0f766e,#b45309);border-radius:10px;font-weight:bold}
.wordpick{display:flex;gap:10px;align-items:center;background:#070b16;border:1px solid #334155;border-radius:12px;padding:10px;margin:8px 0}
.wordpick img{width:120px;height:90px;object-fit:cover;border-radius:10px;flex-shrink:0;background:#1e293b;cursor:pointer;border:2px solid #334155}
.wordpick input[type=checkbox]{width:22px;height:22px;flex-shrink:0}
.ex{color:#94a3b8;font-size:12px}
img.q{width:100%;max-height:280px;object-fit:cover;border-radius:12px;display:block;cursor:pointer;background:#070b16}
.badge{background:#0ea5e9;padding:3px 12px;border-radius:99px;font-size:12px;display:inline-block;margin:2px;color:#000}
canvas{width:100%;background:#070b16;border-radius:12px}
</style>
</head>
<body>
<header><h1>💎 VocabMaster Vx</h1><p>Word Skills 2nd کامل‌شده • هر یونیت 12-18 کلمه واقعی ✅</p></header>
<div class="dash"><div class="stat"><b id="d-t">0</b><span>بانک</span></div><div class="stat"><b id="d-n">0</b><span>نیاز به آموزش</span></div><div class="stat"><b id="d-xp">0</b><span>XP</span></div><div class="stat"><b id="d-d">0</b><span>سررسید</span></div></div>
<nav>
<button id="b-learn" class="active" onclick="tab('learn')">📚 آموزش</button>
<button id="b-book" onclick="tab('book')">📖 کتابی</button>
<button id="b-review" onclick="tab('review')">🔁 تمرین</button>
<button id="b-stats" onclick="tab('stats')">📊 کارنامه</button>
<button id="b-list" onclick="tab('list')">📂 بانک</button>
</nav>
<main>
<section id="t-learn" class="tab active">
<div class="card"><h3>➕ لغت آزاد</h3><div class="row"><input id="w" placeholder="english"><input id="m" placeholder="معنی"><button onclick="add()">افزودن</button></div><p id="msg" style="color:#4ade80"></p></div>
<div class="card need"><h3>📕 نیاز به آموزش (<span id="needCount">0</span>)</h3><div id="needList"></div></div>
<div id="out"></div>
</section>
<section id="t-book" class="tab">
<div class="card"><h3>📖 OPD 12 + Word Skills 2nd Units 1-12 کامل</h3><p class="ex">یونیت ۱ الان ۱۵ کلمه واقعی کتاب دارد. بقیه هم کامل شدند.</p>
<div class="row"><select id="bookSel" onchange="renderLessons()"><option value="OPD">OPD - 12</option><option value="WS" selected>Word Skills 2nd - 1-12 FULL</option></select></div>
<div id="lessons"></div><div id="lessonView"></div></div>
</section>
<section id="t-review" class="tab">
<div class="card"><h3>🔁 تمرین</h3><div class="row"><button onclick="start('mixed')">⭐ هوشمند</button><button class="ghost" onclick="start('en-fa')">EN→FA</button><button class="ghost" onclick="start('fa-en')">FA→EN</button><button class="ghost" onclick="start('image')">🖼️ تصویری</button><button class="ghost" onclick="start('listening')">👂 شنیداری</button><button class="ghost" onclick="start('blank')">⬜ جای‌خالی</button></div><div id="qb"></div></div>
</section>
<section id="t-stats" class="tab"><div class="card"><h3>📊 کارنامه</h3><canvas id="ch" height="150"></canvas><p id="sum" class="ex"></p></div><div class="card"><h3>🚨 ضعیف‌ها</h3><div id="weak"></div></div></section>
<section id="t-list" class="tab"><div class="card"><h3>📂 بانک</h3><div class="row"><button onclick="exportBK()">⬇️ بکاپ</button><button class="ghost" onclick="document.getElementById('imp').click()">⬆️ برگردوندن</button><input type="file" id="imp" accept=".json" style="display:none" onchange="importBK(this)"></div><div class="row"><input id="s" placeholder="جستجو..." oninput="list(1)"></div><div id="wl"></div></div></section>
</main>
<script>
function loadAll(){var a=[],s={};['vmx','vm26','vm25'].forEach(function(k){try{var d=JSON.parse(localStorage.getItem(k)||'[]');if(d&&d.bank)d=d.bank;for(var i=0;i<d.length;i++)if(d[i]&&d[i].word&&!s[d[i].word]){s[d[i].word]=1;if(d[i].wrong==null)d[i].wrong=0;if(d[i].streak==null)d[i].streak=0;if(d[i].next==null)d[i].next=Date.now();a.push(d[i]);}}catch(e){}});return a;}
var DB=loadAll();var NEED=[];try{NEED=JSON.parse(localStorage.getItem('vmxneed')||'[]');if(NEED&&NEED.need)NEED=NEED.need;}catch(e){}var META={};try{META=JSON.parse(localStorage.getItem('vmxmeta')||'{}')}catch(e){}if(!META.xp)META.xp=0;if(!META.hist)META.hist={};
function save(){try{localStorage.setItem('vmx',JSON.stringify(DB));localStorage.setItem('vmxneed',JSON.stringify(NEED));localStorage.setItem('vmxmeta',JSON.stringify(META));}catch(e){}}save();
function tab(t){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('active')});document.getElementById('t-'+t).classList.add('active');document.getElementById('b-'+t).classList.add('active');if(t=='list')list(1);if(t=='book')renderLessons();if(t=='stats')renderStats();if(t=='learn')renderNeed();}
function sp(t){if(!t)return;try{var a=new Audio('https://api.streamelements.com/kappa/v2/speech?voice=Brian&text='+encodeURIComponent(t));a.play().catch(function(){});}catch(e){}}
function inDB(w){for(var i=0;i<DB.length;i++)if(DB[i].word==w)return true;return false;}
function inNeed(w){for(var i=0;i<NEED.length;i++)if(NEED[i].word==w)return true;return false;}
function add(){var w=document.getElementById('w').value.trim().toLowerCase(),m=document.getElementById('m').value.trim();if(!w||!m){alert('هر دو');return;}if(!inDB(w)){DB.unshift({word:w,meaning:m,wrong:0,streak:0,next:Date.now()});save();}dash();learnFast(w,m);}
function renderNeed(){document.getElementById('needCount').textContent=NEED.length;var h='';NEED.forEach(function(x){h+='<div class="def"><b>'+x.word+'</b>='+x.meaning+' <button onclick="teachNeed(\''+x.word+'\')">📖 یادم بده</button> <button class="ghost" onclick="doneNeed(\''+x.word+'\')">✅ یاد گرفتم</button></div>'});document.getElementById('needList').innerHTML=h||'خالیه';}
function teachNeed(w){var m='';NEED.forEach(function(x){if(x.word==w)m=x.meaning});learnFast(w,m);}
function doneNeed(w){var m='';NEED=NEED.filter(function(x){if(x.word==w)m=x.meaning;return x.word!=w});if(!inDB(w))DB.unshift({word:w,meaning:m,wrong:0,streak:0,next:Date.now()});save();dash();renderNeed();}
function needAdd(w,m){if(inDB(w))return;if(!inNeed(w)){NEED.unshift({word:w,meaning:m});save();}dash();renderNeed();}
function learnFast(word,my){var sr=JSON.stringify(imgSources(word)).replace(/"/g,'&quot;');document.getElementById('out').innerHTML='<div class="card"><h2 style="direction:ltr;text-align:left">'+word+'</h2><span class="badge">'+my+'</span><img class="q" data-srcs="'+sr+'" data-i="0" onclick="nextImg(this)" onerror="nextImg(this)" src="https://picsum.photos/seed/'+word+'/600/350"><div class="row"><button onclick="sp(\''+word+'\')">🔊 تلفظ</button></div><div class="def"><div class="en-line">I really love '+word+'.</div><div class="fa-line">'+my+'</div></div></div>';setImg(document.querySelector('#out img'));}
var OPD=[
{lesson:1,title:'OPD 1 - آشپزخانه',words:[['fork','چنگال'],['spoon','قاشق'],['knife','چاقو'],['plate','بشقاب'],['cup','فنجان'],['pan','ماهیتابه'],['pot','قابلمه'],['oven','فر']]},
{lesson:2,title:'OPD 2 - بدن',words:[['eye','چشم'],['nose','بینی'],['mouth','دهان'],['hand','دست'],['foot','پا'],['head','سر'],['heart','قلب'],['ear','گوش']]},
{lesson:3,title:'OPD 3 - خانه',words:[['mother','مادر'],['father','پدر'],['bed','تخت'],['chair','صندلی'],['table','میز'],['door','در'],['window','پنجره'],['lamp','چراغ']]},
{lesson:4,title:'OPD 4 - مدرسه',words:[['book','کتاب'],['pen','خودکار'],['pencil','مداد'],['school','مدرسه'],['teacher','معلم'],['student','دانش‌آموز'],['bag','کیف'],['classroom','کلاس']]},
{lesson:5,title:'OPD 5 - شغل',words:[['doctor','پزشک'],['engineer','مهندس'],['driver','راننده'],['cook','آشپز'],['nurse','پرستار'],['farmer','کشاورز']]},
{lesson:6,title:'OPD 6 - سفر',words:[['car','ماشین'],['bus','اتوبوس'],['train','قطار'],['airplane','هواپیما'],['ticket','بلیط'],['hotel','هتل'],['passport','پاسپورت'],['map','نقشه']]},
{lesson:7,title:'OPD 7 - غذا',words:[['apple','سیب'],['bread','نان'],['rice','برنج'],['meat','گوشت'],['milk','شیر'],['egg','تخم‌مرغ'],['cheese','پنیر'],['water','آب']]},
{lesson:8,title:'OPD 8 - لباس',words:[['shirt','پیراهن'],['pants','شلوار'],['shoes','کفش'],['jacket','کاپشن'],['hat','کلاه'],['dress','پیراهن']]},
{lesson:9,title:'OPD 9 - حیوانات',words:[['dog','سگ'],['cat','گربه'],['bird','پرنده'],['fish','ماهی'],['horse','اسب'],['cow','گاو']]},
{lesson:10,title:'OPD 10 - شهر',words:[['street','خیابان'],['bank','بانک'],['hospital','بیمارستان'],['shop','مغازه'],['park','پارک'],['bridge','پل']]},
{lesson:11,title:'OPD 11 - ورزش',words:[['football','فوتبال'],['tennis','تنیس'],['swim','شنا'],['run','دویدن'],['ball','توپ'],['gym','باشگاه']]},
{lesson:12,title:'OPD 12 - تکنولوژی',words:[['computer','کامپیوتر'],['phone','تلفن'],['internet','اینترنت'],['camera','دوربین'],['screen','صفحه'],['keyboard','کیبورد']]}
];
var WS=[
{lesson:1,mod:'Learning English',title:'Unit 1 - In the classroom FULL',words:[['pencil','مداد'],['pen','خودکار'],['coursebook','کتاب درسی'],['dictionary','دیکشنری'],['notebook','دفتر'],['exercise book','دفتر تمرین'],['piece of paper','تکه کاغذ'],['bag','کیف'],['desk','میز تحریر'],['table','میز'],['chair','صندلی'],['board','تخته'],['whiteboard','وایت‌برد'],['noticeboard','تابلوی اعلانات'],['CD player','سی‌دی پلیر']]},
{lesson:2,mod:'Learning English',title:'Unit 2 - Words about words FULL',words:[['noun','اسم'],['verb','فعل'],['adjective','صفت'],['adverb','قید'],['preposition','حرف اضافه'],['pronoun','ضمیر'],['definite article','حرف تعریف معین the'],['indefinite article','حرف تعریف نامعین a/an'],['past tense','زمان گذشته'],['past participle','اسم مفعول'],['irregular verb','فعل بی‌قاعده'],['lesson','درس'],['class','کلاس']]},
{lesson:3,mod:'Learning English',title:'Unit 3 - Learning a language',words:[['repeat','تکرار کردن'],['practise','تمرین کردن'],['guess','حدس زدن'],['homework','تکلیف'],['text','متن'],['paragraph','پاراگراف'],['dialogue','گفتگو'],['essay','مقاله'],['context','زمینه'],['discussion','بحث'],['activity','فعالیت'],['homework','مشق']]},
{lesson:4,mod:'Numbers and Time',title:'Unit 4 - Numbers',words:[['eight','هشت'],['twenty','بیست'],['thirteen','سیزده'],['sixty','شصت'],['seventy','هفتاد'],['hundred','صد'],['thousand','هزار'],['first','اول'],['second','دوم'],['third','سوم']]},
{lesson:5,mod:'Numbers and Time',title:'Unit 5 - Days months seasons',words:[['Monday','دوشنبه'],['Tuesday','سه‌شنبه'],['Wednesday','چهارشنبه'],['Thursday','پنجشنبه'],['Friday','جمعه'],['Saturday','شنبه'],['Sunday','یکشنبه'],['January','ژانویه'],['February','فوریه'],['spring','بهار'],['summer','تابستان'],['autumn','پاییز'],['winter','زمستان']]},
{lesson:6,mod:'Numbers and Time',title:'Unit 6 - Telling the time',words:[['morning','صبح'],['afternoon','بعدازظهر'],['evening','عصر'],['night','شب'],['midnight','نیمه‌شب'],['midday','ظهر'],['o’clock','سر ساعت'],['quarter','ربع'],['half','نیم'],['clock','ساعت دیواری'],['watch','ساعت مچی']]},
{lesson:7,mod:'People',title:'Unit 7 - Family and friends FULL',words:[['mother','مادر'],['father','پدر'],['sister','خواهر'],['brother','برادر'],['wife','همسر زن'],['husband','همسر مرد'],['son','پسر'],['daughter','دختر'],['friend','دوست'],['neighbour','همسایه'],['colleague','همکار'],['partner','شریک']]},
{lesson:8,mod:'People',title:'Unit 8 - Describing people',words:[['tall','بلندقد'],['short','کوتاه قد'],['young','جوان'],['old','پیر'],['happy','خوشحال'],['sad','ناراحت'],['kind','مهربان'],['funny','بامزه'],['smart','باهوش'],['beautiful','زیبا'],['handsome','خوش‌تیپ']]},
{lesson:9,mod:'Everyday Life',title:'Unit 9 - Daily routines',words:[['wake up','بیدار شدن'],['get up','بلند شدن'],['have breakfast','صبحانه خوردن'],['brush teeth','مسواک زدن'],['go to work','سرکار رفتن'],['have lunch','ناهار خوردن'],['come home','به خانه آمدن'],['have dinner','شام خوردن'],['go to bed','به رختخواب رفتن'],['shower','دوش گرفتن']]},
{lesson:10,mod:'Everyday Life',title:'Unit 10 - Clothes',words:[['shirt','پیراهن'],['T-shirt','تیشرت'],['trousers','شلوار'],['jeans','جین'],['shoes','کفش'],['socks','جوراب'],['jacket','کاپشن'],['coat','پالتو'],['hat','کلاه'],['dress','پیراهن زنانه'],['skirt','دامن'],['suit','کت‌شلوار']]},
{lesson:11,mod:'Food and drink',title:'Unit 11 - Food FULL',words:[['bread','نان'],['rice','برنج'],['meat','گوشت'],['chicken','مرغ'],['fish','ماهی'],['apple','سیب'],['banana','موز'],['orange','پرتقال'],['milk','شیر'],['cheese','پنیر'],['egg','تخم‌مرغ'],['butter','کره'],['water','آب'],['salt','نمک'],['sugar','شکر']]},
{lesson:12,mod:'Food and drink',title:'Unit 12 - In a cafe',words:[['coffee','قهوه'],['tea','چای'],['juice','آبمیوه'],['menu','منو'],['bill','صورتحساب'],['table','میز'],['waiter','گارسون'],['cup','فنجان'],['glass','لیوان'],['cake','کیک'],['sandwich','ساندویچ']]}
];
var CURBOOK='WS',CUR=null;
function renderLessons(){CURBOOK=document.getElementById('bookSel').value;var data=CURBOOK=='OPD'?OPD:WS,h='',last='@@';for(var i=0;i<data.length;i++){var L=data[i];if(L.mod&&L.mod!=last){if(last!='@@')h+='</div>';h+='<div class="mod">📁 '+L.mod+'</div><div class="lesson-grid">';last=L.mod;}if(!L.mod&&i==0)h+='<div class="lesson-grid">';h+='<div class="lesson" onclick="openLesson('+i+')"><b>'+L.title+'</b><br><span class="ex">'+L.words.length+' کلمه 👆</span></div>';var nx=data[i+1];if(!nx||(nx.mod&&nx.mod!=L.mod))h+='</div>';}document.getElementById('lessons').innerHTML=h;document.getElementById('lessonView').innerHTML='';}
function imgSources(w){w=(w||'book').toLowerCase().trim();var f=w.split(' ').pop().replace(/[^a-z]/g,'')||'book';return ['wiki:'+f,'https://image.pollinations.ai/prompt/'+encodeURIComponent('photo of '+w)+'?width=400&height=300&nologo=true','https://picsum.photos/seed/'+f+'/400/300'];}
function setImg(im){if(!im)return;try{if(!im.getAttribute('data-srcs')){im.setAttribute('data-srcs',JSON.stringify(imgSources(im.getAttribute('data-w')||'book')));im.setAttribute('data-i','0');}var s=JSON.parse(im.getAttribute('data-srcs'));var i=parseInt(im.getAttribute('data-i')||'0');if(i>=s.length)return;var c=s[i];if(c.indexOf('wiki:')==0){fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(c.slice(5))).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(j&&j.thumbnail)im.src=j.thumbnail.source;else throw 0}).catch(function(){im.setAttribute('data-i',i+1);setImg(im)});}else{im.onerror=function(){im.setAttribute('data-i',i+1);im.onerror=null;setImg(im)};im.src=c;}}catch(e){}}
function nextImg(im){var i=parseInt(im.getAttribute('data-i')||'0')+1;im.setAttribute('data-i',i);im.onerror=null;setImg(im);}
function openLesson(idx){var data=CURBOOK=='OPD'?OPD:WS;CUR=data[idx];var h='<div class="card"><h3>'+CUR.title+' ('+CUR.words.length+' کلمه واقعی)</h3>';CUR.words.forEach(function(p){var w=p[0],m=p[1];var has=inDB(w);var sr=JSON.stringify(imgSources(w)).replace(/"/g,'&quot;');h+='<div class="wordpick"><input type="checkbox" data-w="'+w+'" data-m="'+m+'" '+(has?'checked disabled':'')+'><img data-srcs="'+sr+'" data-i="0" onclick="nextImg(this)" src="https://picsum.photos/seed/'+w.replace(/[^a-z]/g,'')+'/240/180" loading="lazy"><div style="flex:1"><b style="direction:ltr;display:block">'+w+'</b><span class="ex">'+m+'</span><br><button class="ghost" onclick="sp(\''+w+'\')">🔊</button> <button class="danger" onclick="needAdd(\''+w+'\',\''+m+'\')">❌ بلد نیستم</button></div></div>'});h+='<div class="row"><button onclick="addLesson()">➕ تیک‌ها به بانک</button><button class="ghost" onclick="quizLesson()">تست</button></div></div>';var lv=document.getElementById('lessonView');lv.innerHTML=h;lv.scrollIntoView();lv.querySelectorAll('img').forEach(function(im){im.onerror=function(){nextImg(im)};setImg(im)});}
function addLesson(){var c=document.querySelectorAll('#lessonView input:not(:disabled)'),n=0;for(var i=0;i<c.length;i++)if(c[i].checked){var w=c[i].getAttribute('data-w'),m=c[i].getAttribute('data-m');if(!inDB(w)){DB.unshift({word:w,meaning:m,wrong:0,streak:0,next:Date.now()});n++;}}save();dash();alert(n+' اضافه شد');}
function quizLesson(){if(!CUR)return;Q=CUR.words.map(function(x){return {word:x[0],meaning:x[1]}});QI=0;SC=0;QM='mixed';tab('review');nq();}
function dash(){document.getElementById('d-t').textContent=DB.length;document.getElementById('d-n').textContent=NEED.length;var d=0;DB.forEach(function(x){if(x.next<=Date.now())d++});document.getElementById('d-d').textContent=d;document.getElementById('d-xp').textContent=META.xp;}
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var Q=[],QI=0,SC=0,QM='mixed';
function start(m){if(DB.length<2){alert('کمه');return;}QM=m;Q=sh(DB.slice()).slice(0,10);QI=0;SC=0;nq();}
function nq(){var b=document.getElementById('qb');if(QI>=Q.length){b.innerHTML='<h3>تمام '+SC+'</h3>';META.xp+=SC*10;save();dash();return;}var w=Q[QI];var t=QM=='mixed'?['en-fa','fa-en','image','blank','listening'][Math.floor(Math.random()*5)]:QM;
if(t=='image'){var o=sh([w.word].concat(sh(DB.filter(function(x){return x.word!=w.word}).map(function(x){return x.word})).slice(0,3)));var sr=JSON.stringify(imgSources(w.word)).replace(/"/g,'&quot;');b.innerHTML='<p>🖼️ این عکس چیه؟</p><img class="q" data-srcs="'+sr+'" data-i="0" onclick="nextImg(this)" src="https://picsum.photos/seed/'+w.word+'/600/350">'+o.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.word+'\')">'+x+'</button>'}).join('');var im=b.querySelector('img');im.onerror=function(){nextImg(im)};setImg(im);return;}
if(t=='fa-en'){var o3=sh([w.word].concat(sh(DB.filter(function(x){return x.word!=w.word}).map(function(x){return x.word})).slice(0,3)));b.innerHTML='<h3>'+w.meaning+' به انگلیسی؟</h3>'+o3.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.word+'\')">'+x+'</button>'}).join('');return;}
if(t=='listening'){b.innerHTML='<p>👂 گوش بده</p><div class="row"><button onclick="sp(\''+w.word+'\')">پخش</button></div><div class="row"><input id="li"><button onclick="cl(\''+w.word+'\')">ثبت</button></div>';sp(w.word);return;}
if(t=='blank'){var mk=('I love '+w.word).replace(w.word,'_____');var o4=sh([w.word].concat(sh(DB.filter(function(x){return x.word!=w.word}).map(function(x){return x.word})).slice(0,3)));b.innerHTML='<div class="def">'+mk+'</div>'+o4.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.word+'\')">'+x+'</button>'}).join('');return;}
var o2=sh([w.meaning].concat(sh(DB.filter(function(x){return x.word!=w.word}).map(function(x){return x.meaning})).slice(0,3)));b.innerHTML='<h3>'+w.word+' یعنی چی؟</h3>'+o2.map(function(x){return '<button class="opt" onclick="ans(this,\''+x+'\',\''+w.meaning+'\')">'+x+'</button>'}).join('');}
function cl(c){var v=document.getElementById('li').value.trim().toLowerCase();if(v==c)SC++;QI++;nq();}
function ans(btn,v,cor){if(v==cor)SC++;btn.classList.add(v==cor?'ok':'no');setTimeout(function(){QI++;nq()},500);}
function renderStats(){var wk=DB.filter(function(x){return x.wrong>=2}).slice(0,10);document.getElementById('weak').innerHTML=wk.map(function(x){return '<div class="def">'+x.word+'='+x.meaning+'</div>'}).join('')||'نداری';document.getElementById('sum').textContent='XP:'+META.xp;}
function exportBK(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({bank:DB,need:NEED})]));a.download='vocab-vx-backup.json';a.click();}
function importBK(i){var f=i.files[0],r=new FileReader();r.onload=function(){var j=JSON.parse(r.result);var a=j.bank||j;var s={};DB.forEach(function(x){s[x.word]=1});a.forEach(function(x){if(!s[x.word])DB.push(x)});save()};r.readAsText(f);}
function list(p){var q=document.getElementById('s').value.trim().toLowerCase(),f=DB.filter(function(x){return !q||x.word.includes(q)});document.getElementById('wl').innerHTML=f.slice(0,40).map(function(x){return '<div class="def">'+x.word+'='+x.meaning+'</div>'}).join('');}
renderLessons();dash();renderNeed();
</script>
</body>
</html>
